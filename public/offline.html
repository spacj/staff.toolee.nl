<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4c6ef5">
  <title>Offline · Staff2</title>
  <style>
    :root{
      --paper:#f6f7fb; --card:#ffffff; --ink:#12141c; --muted:#5b6172; --line:#e6e8f0;
      --brand:#4c6ef5; --indigo:#4338ca; --purple:#6d28d9;
    }
    @media (prefers-color-scheme: dark){
      :root{ --paper:#0e1016; --card:#161923; --ink:#eef0f6; --muted:#99a1b5; --line:#252a3a; }
    }
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; background:var(--paper); color:var(--ink); padding:24px;
      -webkit-font-smoothing:antialiased;
    }
    .card{
      text-align:center; max-width:380px; width:100%;
      background:var(--card); border:1px solid var(--line);
      border-radius:24px; padding:40px 28px;
      box-shadow:0 20px 50px -24px rgba(20,24,40,.4);
    }
    .badge{
      width:64px; height:64px; border-radius:18px; margin:0 auto 22px;
      background:linear-gradient(135deg,var(--brand) 0%,var(--indigo) 55%,var(--purple) 100%);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 10px 26px -8px rgba(76,110,245,.6);
    }
    .badge svg{ width:60%; height:60%; }
    h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; margin-bottom:10px; }
    p{ color:var(--muted); font-size:15px; line-height:1.55; margin-bottom:24px; }
    button{
      background:var(--brand); color:#fff; border:0; padding:13px 26px;
      border-radius:12px; font-size:14px; font-weight:600; cursor:pointer;
      transition:background .2s, transform .1s;
    }
    button:hover{ background:#3b5bdb; }
    button:active{ transform:translateY(1px); }
    .brand{ margin-top:22px; font-size:12px; font-weight:600; letter-spacing:.14em; color:var(--muted); }
    .brand b{ color:var(--ink); }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="#fff">
        <circle cx="22" cy="24" r="6.5"/>
        <path d="M10 48a12 12 0 0 1 24 0z"/>
        <circle cx="42" cy="24" r="6.5"/>
        <path d="M30 48a12 12 0 0 1 24 0z"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Check your internet connection and try again. Anything you change will sync automatically once you're back online.</p>
    <button onclick="window.location.reload()">Try again</button>
    <div class="brand"><b>Staff2</b> · staff2.app</div>
  </div>
</body>
</html>
